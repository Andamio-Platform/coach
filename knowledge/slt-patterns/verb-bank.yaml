# Verb Bank
# Effective verbs organized by Bloom's level
# Populated from successful SLT rewrites across courses

version: 1
last_updated: "2026-02-28"

# Verbs that consistently produce measurable, assessable SLTs
# Each entry tracks: verb, bloom_level, success_count, example_slts

remember:
  effective_verbs: []

understand:
  # e.g., explain, describe, summarize, compare
  effective_verbs:
    - verb: describe
      success_count: 3
      example_slts:
        - "I can describe how courses are structured."
        - "I can describe how courses are structured."
        - "I can describe how a Nostr relay fits into the client-relay architecture."
      notes: "Works well for conceptual/Exploration SLTs. Produces assessable explanations. Strong across both platform and infrastructure courses."

    - verb: identify
      success_count: 2
      example_slts:
        - "I can navigate the course catalog and identify key course metadata."
        - "I can browse projects and identify how credentials relate to project eligibility."
      notes: "Strong as secondary verb paired with a primary action verb. Avoid prescribing what to identify (no parenthetical lists)."

    - verb: explain
      success_count: 2
      example_slts:
        - "I can explain the assignment review workflow."
        - "I can explain the contributor assessment workflow."
      notes: "Good for conceptual SLTs. Avoid appending colon lists that prescribe the explanation."

apply:
  # e.g., use, demonstrate, implement, execute
  effective_verbs:
    - verb: navigate
      success_count: 3
      example_slts:
        - "I can navigate the course catalog and identify key course metadata."
        - "I can navigate to lesson content within a course module."
        - "I can navigate the admin dashboard to find workspace features."
      notes: "Strong Product Demo verb for UI orientation. Maps cleanly to 'learner reaches destination.' Also works as beachball for orientation SLTs."

    - verb: connect
      success_count: 1
      example_slts:
        - "I can connect a wallet to the platform."
      notes: "Clear procedural verb, observable outcome."

    - verb: mint
      success_count: 1
      example_slts:
        - "I can mint a portable access token with a unique alias."
      notes: "Domain-specific verb. Acceptable in SLTs when the audience knows the term."

    - verb: browse
      success_count: 1
      example_slts:
        - "I can browse projects and identify how credentials relate to project eligibility."
      notes: "Product Demo verb for discovery/exploration UI."

    - verb: enroll
      success_count: 1
      example_slts:
        - "I can enroll in a course by submitting an assignment commitment on the blockchain."
      notes: "The 'by submitting...' clause is acceptable here because it names the mechanism (not an assessment method)."

    - verb: claim
      success_count: 1
      example_slts:
        - "I can claim my credential after teacher approval."
      notes: "Clear procedural outcome. 'After teacher approval' is context, not prescription."

    - verb: commit
      success_count: 1
      example_slts:
        - "I can commit to a project task and submit evidence of completed work."
      notes: "Domain-specific. 'And submit evidence' is acceptable because it's a second step in the same flow, not a dual capability."

    - verb: use
      success_count: 1
      example_slts:
        - "I can use my credential to join a project as a contributor."
      notes: "Works when the purpose clause ('to join a project') is concrete and observable."

    - verb: find
      success_count: 1
      example_slts:
        - "I can find new opportunities for learning and contributing to projects."
      notes: "Intentional beachball. Works for reflective/exploratory SLTs. Would be too vague for a procedural SLT."

    - verb: create
      success_count: 3
      example_slts:
        - "I can create lesson content using the Tiptap rich text editor."
        - "I can create a project on the blockchain."
        - "I can create a task with a reward amount and expiration date."
      notes: "Good for tool-specific SLTs. Tool name is acceptable context."

    - verb: add
      success_count: 2
      example_slts:
        - "I can add a teacher to a course."
        - "I can add and remove project managers."
      notes: "Clean. Avoid 'at least one' quantity prescriptions. Symmetrical add/remove in one SLT is acceptable."

    - verb: write
      success_count: 1
      example_slts:
        - "I can write effective Student Learning Targets."
      notes: "Clean. Avoid appending formula prescriptions."

    - verb: install
      success_count: 1
      example_slts:
        - "I can install nostr-rs-relay and its dependencies on a Linux server."
      notes: "Procedural verb for How To Guide. Slightly task-like but acceptable when installation is a genuine skill."

    - verb: run
      success_count: 1
      example_slts:
        - "I can run nostr-rs-relay and verify it accepts WebSocket connections."
      notes: "Procedural verb. 'And verify' is acceptable as a second step in the same flow (run then check)."

    - verb: configure
      success_count: 3
      example_slts:
        - "I can configure nostr-rs-relay settings for my use case."
        - "I can configure paid relay access or authentication requirements."
        - "I can configure course prerequisites for a project."
      notes: "Strong How To Guide verb for terminal/config. Also Product Demo when configuring via UI. Avoid appending inline lists of what to configure."

    - verb: "set up"
      success_count: 1
      example_slts:
        - "I can set up a reverse proxy with TLS so clients connect to the relay over a secure domain."
      notes: "Good for multi-step procedural SLTs. Purpose clause ('so clients connect...') adds context without prescribing method."

    - verb: define
      success_count: 1
      example_slts:
        - "I can define a moderation policy for my relay."
      notes: "Exploration verb for thinking-before-doing SLTs. The act of defining a policy is conceptual, not procedural."

    - verb: monitor
      success_count: 2
      example_slts:
        - "I can monitor relay health and diagnose common issues."
        - "I can monitor contributor activity."
      notes: "How To Guide verb when paired with diagnosis. Lighter/borderline task-focused for data-reading SLTs."

    - verb: update
      success_count: 1
      example_slts:
        - "I can update nostr-rs-relay and apply configuration changes without extended downtime."
      notes: "Maintenance verb. 'Without extended downtime' is context, not prescription."

    - verb: remove
      success_count: 1
      example_slts:
        - "I can remove tasks from the treasury to reclaim funds."

    - verb: generate
      success_count: 1
      example_slts:
        - "I can generate and export a treasury report."

    - verb: export
      success_count: 1
      example_slts:
        - "I can generate and export a treasury report."

    - verb: fund
      success_count: 1
      example_slts:
        - "I can fund the project treasury and publish tasks on-chain."

    - verb: publish
      success_count: 1
      example_slts:
        - "I can fund the project treasury and publish tasks on-chain."

analyze:
  # e.g., distinguish, examine, compare, contrast
  effective_verbs:
    - verb: compare
      success_count: 2
      example_slts:
        - "I can compare a portable access token to a traditional platform account."
        - "I can compare nostr-rs-relay to other relay implementations."
      notes: "Strong Exploration verb. Avoid 'by identifying...' how-clauses. Works for both conceptual comparisons and technical tool selection."

evaluate:
  effective_verbs:
    - verb: assess
      success_count: 1
      example_slts: ["I can assess a contributor's assignment."]
      notes: "Highest Bloom's level in a tool-operation course. Appropriate when decision has irreversible on-chain consequences."

create:
  effective_verbs: []

# Verbs to avoid - consistently produce unmeasurable SLTs
avoid:
  problematic_verbs: []
