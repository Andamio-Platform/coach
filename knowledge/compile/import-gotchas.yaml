# Import Gotchas
# Issues discovered when compiling and importing lesson modules
# Used by /compile to validate output before upload
# Updated by /compound skill

version: 1
last_updated: "2026-03-16"

# Each gotcha includes:
# - id: unique identifier
# - issue: what goes wrong
# - cause: why it happens
# - detection: how /compile can check for this
# - fix: what to do

gotchas:

  - id: placeholder-lesson-skipped
    issue: "Importer skips minimal/placeholder lesson files and re-indexes remaining lessons sequentially against SLTs"
    cause: "A lesson file had trivial content ('Empty Lesson OK'). The importer treated it as empty, so subsequent lessons mapped to the wrong SLTs, leaving the final SLT with no lesson."
    detection: "Check that every lesson-N.md has substantive content (at minimum an H1 heading and one paragraph). Flag any file under ~50 bytes or without a markdown heading."
    fix: "Either write real content for every lesson slot, or remove the file entirely and accept the gap — don't use placeholder files."
    severity: critical

  - id: lesson-h1-required
    issue: "Lesson files must have an H1 heading — it becomes the lesson title in the platform"
    cause: "Lesson files without an H1 heading import with blank titles. The importer extracts the first H1 as the lesson title field."
    detection: "Check that every lesson-N.md starts with an '# H1 Title' heading."
    fix: "Add a short, descriptive H1 title to every lesson file. Don't use the 'Lesson X.Y:' prefix format — just a clean title."
    severity: critical

# Validation checklist for /compile
# Run these checks before declaring a module ready for upload
validation_checklist:
  - check: "Every lesson-N.md has substantive content (H1 + paragraph minimum)"
    prevents: placeholder-lesson-skipped
  - check: "Every lesson-N.md starts with an # H1 Title heading"
    prevents: lesson-h1-required
