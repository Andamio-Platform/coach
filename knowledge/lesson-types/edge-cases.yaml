# Edge Cases
# Ambiguous lesson type classifications and how they were resolved
# Used by /classify-lesson-types to handle known ambiguities

version: 1
last_updated: null

# Each edge case includes:
# - slt: the SLT text
# - candidates: list of plausible lesson types
# - chosen: the selected lesson type
# - deciding_factor: what determined the choice
# - question_that_helped: the discriminating question that clarified

edge_cases:
  - slt: "I can assess a contributor's assignment."
    candidates: ["product_demo", "exploration"]
    chosen: exploration
    deciding_factor: "The Accept/Refuse/Deny framework has deliberate design trade-offs (irreversibility gates, expiration requirements) that a project owner must internalize. Understanding WHY matters more than knowing WHERE to click."
    question_that_helped: "Does the learner need to understand WHY the system works this way, or just HOW to use it?"

# Recurring ambiguity patterns
ambiguity_patterns:
  - pattern: "SLT uses a verb that implies judgment (assess, evaluate, decide) but the action happens through a UI"
    candidates: ["product_demo", "exploration"]
    discriminating_question: "Does the protocol deliberately design different consequence levels for the decision? If yes, the framework IS the skill → Exploration."
    resolution_guidance:
      exploration: "Protocol has irreversible vs recoverable paths, expiration gates, or deliberate friction"
      product_demo: "Decision is straightforward — the UI guides the user, no judgment framework needed"
# Each entry:
# - pattern: description of the ambiguous situation
# - candidates: the lesson types that could apply
# - discriminating_question: question to ask user
# - resolution_guidance: how different answers map to types
