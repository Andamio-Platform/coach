# Lesson Type Heuristics
# Patterns for classifying SLTs by lesson type
# Used by /classify-lesson-types to improve initial guesses

version: 2
last_updated: "2026-03-21"

# Verb patterns: certain verbs strongly suggest certain lesson types
verb_patterns:
  # Product Demo verbs (practical UI skills)
  - verb: navigate
    suggests: product_demo
    confidence: high
    count: 2
    examples: ["I can navigate the course catalog...", "I can navigate to lesson content..."]
  - verb: browse
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can browse projects and identify..."]
  - verb: connect
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can connect a wallet..."]
  - verb: mint
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can mint a portable access token..."]
  - verb: enroll
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can enroll in a course by submitting..."]
  - verb: claim
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can claim my credential after teacher approval."]
  - verb: commit
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can commit to a project task..."]
  - verb: use
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can use my credential to join a project..."]
  - verb: create
    suggests: product_demo
    confidence: high
    count: 2
    examples: ["I can create a project on the blockchain.", "I can create a task with a reward amount and expiration date."]
  - verb: configure
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can configure course prerequisites for a project."]
  - verb: fund
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can fund the project treasury and publish tasks on-chain."]
  - verb: publish
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can fund the project treasury and publish tasks on-chain."]
  - verb: remove
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can remove tasks from the treasury to reclaim funds."]
  - verb: add
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can add and remove project managers."]
  - verb: monitor
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can monitor contributor activity."]
  - verb: generate
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can generate and export a treasury report."]
  - verb: export
    suggests: product_demo
    confidence: high
    count: 1
    examples: ["I can generate and export a treasury report."]
  # Exploration verbs (conceptual understanding)
  - verb: compare
    suggests: exploration
    confidence: high
    count: 1
    examples: ["I can compare a portable access token to a traditional platform account."]
  - verb: describe
    suggests: exploration
    confidence: high
    count: 1
    examples: ["I can describe how courses are structured."]
  - verb: find
    suggests: exploration
    confidence: medium
    count: 1
    notes: "Exploration when about conceptual 'what's next', Product Demo when about UI navigation"
    examples: ["I can find new opportunities for learning and contributing to projects."]
  # How To Guide verbs (terminal/config procedures)
  - verb: install
    suggests: how_to_guide
    confidence: high
    count: 1
    examples: ["I can install nostr-rs-relay and its dependencies on a Linux server."]
  - verb: run
    suggests: how_to_guide
    confidence: high
    count: 1
    examples: ["I can run nostr-rs-relay and verify it accepts WebSocket connections."]
  - verb: configure
    suggests: how_to_guide
    confidence: high
    count: 2
    notes: "How To Guide when interface is terminal/config files. Could be Product Demo when configuring via UI."
    examples: ["I can configure nostr-rs-relay settings for my use case.", "I can configure paid relay access or authentication requirements."]
  - verb: "set up"
    suggests: how_to_guide
    confidence: high
    count: 1
    examples: ["I can set up a reverse proxy with TLS so clients connect to the relay over a secure domain."]
  - verb: monitor
    suggests: how_to_guide
    confidence: high
    count: 1
    examples: ["I can monitor relay health and diagnose common issues."]
  - verb: update
    suggests: how_to_guide
    confidence: high
    count: 1
    examples: ["I can update nostr-rs-relay and apply configuration changes without extended downtime."]
  - verb: define
    suggests: exploration
    confidence: high
    count: 1
    notes: "Exploration when about policy/strategy thinking. The act of defining precedes implementing."
    examples: ["I can define a moderation policy for my relay."]
  - verb: assess
    suggests: exploration
    confidence: high
    count: 1
    notes: "Exploration when judgment behind the action matters more than the mechanics. 'Assess' implies evaluation — higher cognitive demand than clicking buttons."
    examples: ["I can assess a contributor's assignment."]

# Subject matter patterns: certain topics suggest certain lesson types
subject_patterns:
  - keywords: ["wallet", "platform UI", "catalog", "dashboard"]
    suggests: product_demo
    confidence: high
    count: 3
    examples: ["I can connect a wallet...", "I can navigate the course catalog..."]
  - keywords: ["enrollment", "submission", "transaction", "on-chain"]
    suggests: product_demo
    confidence: high
    count: 4
    notes: "On-chain actions via UI are Product Demo"
    examples: ["I can enroll in a course by submitting...", "I can claim my credential..."]
  - keywords: ["ownership", "portability", "self-sovereign", "vs traditional"]
    suggests: exploration
    confidence: high
    count: 1
    examples: ["I can compare a portable access token to a traditional platform account."]
  - keywords: ["structure", "hierarchy", "why", "design"]
    suggests: exploration
    confidence: high
    count: 1
    examples: ["I can describe how courses are structured."]
  - keywords: ["opportunities", "journey", "what's next", "skill gaps"]
    suggests: exploration
    confidence: high
    count: 1
    notes: "Reflective thinking about learning path"
    examples: ["I can find new opportunities for learning and contributing to projects."]
  - keywords: ["install", "dependencies", "build", "compile", "server"]
    suggests: how_to_guide
    confidence: high
    count: 2
    notes: "Server/infrastructure setup via terminal"
    examples: ["I can install nostr-rs-relay and its dependencies on a Linux server.", "I can run nostr-rs-relay and verify it accepts WebSocket connections."]
  - keywords: ["config", "settings", "TLS", "reverse proxy", "nginx", "certificate"]
    suggests: how_to_guide
    confidence: high
    count: 2
    notes: "Configuration files and infrastructure setup"
    examples: ["I can configure nostr-rs-relay settings for my use case.", "I can set up a reverse proxy with TLS..."]
  - keywords: ["monitor", "logs", "health", "update", "maintain", "downtime"]
    suggests: how_to_guide
    confidence: high
    count: 2
    notes: "Operations and maintenance tasks"
    examples: ["I can monitor relay health and diagnose common issues.", "I can update nostr-rs-relay..."]
  - keywords: ["policy", "moderation", "philosophy", "trade-offs"]
    suggests: exploration
    confidence: high
    count: 1
    notes: "Policy definition is conceptual thinking, not procedural"
    examples: ["I can define a moderation policy for my relay."]
  - keywords: ["protocol", "architecture", "client-relay", "relay implementations"]
    suggests: exploration
    confidence: high
    count: 2
    notes: "Protocol concepts and technical comparisons"
    examples: ["I can describe how a Nostr relay fits into the client-relay architecture.", "I can compare nostr-rs-relay to other relay implementations."]
  - keywords: ["treasury", "tasks", "reward", "fund", "publish"]
    suggests: product_demo
    confidence: high
    count: 3
    examples: ["I can create a task with a reward amount...", "I can fund the project treasury...", "I can remove tasks from the treasury..."]
  - keywords: ["managers", "team", "contributor activity", "reports"]
    suggests: product_demo
    confidence: high
    count: 3
    examples: ["I can add and remove project managers.", "I can monitor contributor activity.", "I can generate and export a treasury report."]
  - keywords: ["assess", "irreversible", "consequences", "accept", "refuse", "deny"]
    suggests: exploration
    confidence: high
    count: 1
    notes: "When the protocol deliberately designs different consequence levels, understanding the framework IS the skill"
    examples: ["I can assess a contributor's assignment."]

# Combination patterns: verb + subject combinations
combination_patterns: []
# Each entry:
# - verb: the verb
# - subject_keywords: list of keywords
# - suggests: lesson type
# - confidence: high, medium, low
# - count: times this pattern held

# Key insight from classification experience
meta_heuristics:
  practical_vs_conceptual:
    description: "For intro courses, practical skills (navigate, click, submit) → Product Demo; conceptual understanding (compare, describe, reflect) → Exploration"
    confidence: high
  interface_determines_type:
    description: "The primary interface determines whether practical SLTs become Product Demo or How To Guide. UI-driven courses → Product Demo. Terminal/config-driven courses → How To Guide. The verb alone is not enough — 'configure' is How To Guide for terminal work but could be Product Demo for UI settings."
    confidence: high
  define_before_configure:
    description: "SLTs that ask learners to 'define' a policy or strategy before implementing it are Exploration, even in procedural courses. The thinking precedes the doing."
    confidence: high
  why_vs_how:
    description: "When an SLT could be Product Demo or Exploration, ask: 'Does the learner need to understand WHY the system works this way, or just HOW to use it?' If the protocol's design rationale is part of the capability, it's Exploration."
    confidence: high

# Lesson type definitions for quick reference
lesson_types:
  product_demo:
    description: "UI walkthroughs, platform features, visual sequences"
    typical_verbs: ["navigate", "use", "access", "configure"]
    typical_subjects: ["UI", "interface", "platform", "dashboard", "settings"]

  developer_documentation:
    description: "API usage, library integration, code-heavy technical skills"
    typical_verbs: ["implement", "build", "create", "integrate", "write"]
    typical_subjects: ["API", "library", "code", "function", "endpoint"]

  how_to_guide:
    description: "Step-by-step procedures without heavy UI or code"
    typical_verbs: ["follow", "execute", "perform", "complete"]
    typical_subjects: ["process", "workflow", "procedure", "steps"]

  organization_onboarding:
    description: "Org-specific setup, policies, team conventions"
    typical_verbs: ["set up", "configure", "join", "access"]
    typical_subjects: ["team", "organization", "account", "permissions"]

  exploration:
    description: "Big ideas, conceptual territory, worldview challenges"
    typical_verbs: ["explain", "describe", "compare", "evaluate", "argue"]
    typical_subjects: ["concept", "principle", "philosophy", "approach", "trade-offs"]
