# Calibration Data
# Self-assessed readiness vs actual performance
# Used by /self-assess-readiness to adjust confidence

version: 1
last_updated: "2026-03-06"

# Each calibration entry includes:
# - slt_id: SLT identifier (course:module.number)
# - self_assessed: Ready, Needs Context, Needs Human
# - actual_outcome: success, partial, failure
# - dimensions_off: which dimensions were miscalibrated
# - notes: what was learned

entries:
  # Ready / success — simple case, no corrections needed
  - slt_id: "course:1.1"
    self_assessed: "Ready"
    actual_outcome: success
    dimensions_off: []
    notes: "Exploration lesson on well-documented concept. Built from existing knowledge without external context. User gave style feedback (sentence rhythm, word choice) but no knowledge corrections — self-assessment was accurate."

  # Needs Context / success with dimensions_off — shows miscalibration detection
  - slt_id: "course:3.1"
    self_assessed: "Needs Context"
    actual_outcome: success
    dimensions_off:
      - "Conceptual was actually Weak — assumed enrollment required to view lessons"
    notes: "User corrected key misconception: lessons are public, no enrollment needed. Readiness assessment claimed restricted access — wrong. Screenshots provided sufficient context to complete the lesson, but a dimension was miscalibrated."

  # Needs Context / partial — self-assessment caught a real gap
  - slt_id: "course:4.2"
    self_assessed: "Needs Context"
    actual_outcome: partial
    dimensions_off:
      - "Code Demo was Weak as predicted — guessed wrong endpoint paths"
    notes: "Initially guessed plausible but incorrect API endpoint paths. Audit against actual codebase was critical. Self-assessment correctly flagged this as high confabulation risk, but the gap was deeper than expected."

# Aggregate calibration stats
stats:
  total_entries: 3
  ready_assessed: 1
  ready_correct: 1
  needs_context_assessed: 2
  needs_context_correct: 2
  accuracy_rate: 100
  dimension_accuracy_rate: 67  # 1 of 3 entries had dimension miscalibration
  common_overconfidence:
    - "Conceptual dimension for Product Demo SLTs — rated Partial but was actually Weak due to incorrect assumptions about platform behavior"
  common_underconfidence: []

# Calibration adjustments
adjustments:
  rules:
    - "For Product Demo SLTs on unfamiliar platforms, assume Conceptual is Weak (not Partial) unless verified by human or live testing. Screenshots alone may not reveal interaction flow assumptions."
    - "Platform behavior assumptions (e.g., 'enrollment required to view content') are a common source of overconfidence. Flag assumptions explicitly in gap analysis."
    - "Exploration SLTs on well-documented concepts (ownership models, protocol architecture) reliably self-assess as Ready. These are safe to build first."
    - "Style feedback (em-dash patterns, route-path formatting) is orthogonal to readiness. Don't conflate writing style corrections with knowledge gaps."
    - "For How To Guide SLTs on well-documented open source projects, GitHub README + config file reference is usually sufficient context. Fetch these first — they unlock the most SLTs per resource."
    - "Exploration SLTs on well-documented protocols reliably self-assess as Ready across multiple courses. Pattern confirmed across different course types."
    - "For Developer Documentation SLTs with API endpoints or transaction paths, audit lessons against actual codebase BEFORE compiling. These are high-confabulation zones — endpoints that sound plausible may be wrong. Codebase access is necessary but not sufficient; explicit verification step catches errors."
    - "Template/codebase access via file system can serve as context for Needs Context SLTs, converting 'fetch docs' into 'read existing code'."
    - rule: "When source documentation has complete guide pages with screenshots, rate Ready with high confidence"
      evidence: "Ready SLTs with complete docs consistently succeed"
    - rule: "When source documentation is a stub, rate Needs Context — not Needs Human — if the concept is straightforward UI walkthrough"
      evidence: "Needs Context SLTs resolved with screenshots alone, no expert needed"
    - rule: "Screenshot audit after lesson writing can upgrade Ready lessons — unused screenshots in adjacent directories often fill gaps not anticipated during readiness assessment"
      evidence: "Multiple Ready lessons improved with screenshots discovered during audit"
