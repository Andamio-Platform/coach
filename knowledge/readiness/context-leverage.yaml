  - resource: "Human platform knowledge corrections"
    type: "Human Review"
    slts_unlocked:
      - "contributors:3.1"
      - "contributors:3.2"
    priority: "High"
    obtained: true
    effectiveness: confirmed
    notes: "Screenshots showed the UI but not the interaction model. Human corrections were essential: (1) lessons are public, no enrollment needed; (2) enrollment = first assignment commitment, no separate button; (3) two-phase submission: Lock My Work then Submit Assignment; (4) first commitment includes deposit, returned on credential claim. These corrections were captured in voice-patterns.md Platform Facts section for reuse across all future lessons."
    courses_seen_in: ["andamio-for-contributors"]

  - resource: "Tiered screenshot capture approach"
    type: "Process"
    slts_unlocked: []
    priority: "Medium"
    obtained: true
    effectiveness: confirmed
    notes: "Not a content resource but a process insight. Capturing screenshots in dependency tiers (browse → identity → learn → credential → contribute) is the highest-leverage process pattern for Product Demo courses. Each tier requires the previous tier's artifacts. Plan for async gaps (teacher approval between Tier 3 and 4). Writing lessons in capture order (not SLT order) is more efficient."
    courses_seen_in: ["andamio-for-contributors"]

