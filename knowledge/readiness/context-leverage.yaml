# Context Leverage
# Resources ranked by how many SLTs they unlock
# Used by /self-assess-readiness to prioritize shopping list
#
# Each resource includes:
# - resource: description of the resource
# - type: Docs, Example Code, Human Review, Screenshots, Process, Version Confirmation
# - slts_unlocked: list of SLT identifiers
# - priority: High, Medium, Low (computed from slt count)
# - obtained: boolean - has this been gathered?
# - effectiveness: null | confirmed | partial | unhelpful (after use)
# - notes: any observations about this resource

version: 1
last_updated: "2026-03-21"

resources:
  # --- Docs example: open-source project README fetched via gh API ---
  - resource: "nostr-rs-relay README + GitHub docs"
    type: "Docs"
    slts_unlocked:
      - "course:2.1"
      - "course:2.2"
      - "course:3.1"
      - "course:3.2"
      - "course:5.2"
    priority: "High"
    obtained: true
    effectiveness: confirmed
    notes: "Highest leverage resource for this course — unlocked 5 SLTs. Included install deps, run command, default port, and reverse proxy config. Fetched via gh API in one command."

  # --- Screenshots example: UI capture set for a product demo course ---
  - resource: "Product UI screenshot set (login, dashboard, workflow)"
    type: "Screenshots"
    slts_unlocked:
      - "course:1.2"
      - "course:1.3"
      - "course:2.1"
      - "course:2.3"
      - "course:3.1"
      - "course:3.2"
    priority: "High"
    obtained: partial
    effectiveness: confirmed
    notes: "Screenshots captured across multiple sessions. Screenshots alone were necessary but NOT sufficient for some SLTs — human corrections about platform behavior were critical."

  # --- Process example: context-fetching method insight ---
  - resource: "gh API is fastest context-fetching method"
    type: "Process"
    slts_unlocked: []
    priority: "Medium"
    obtained: true
    effectiveness: confirmed
    notes: "Process insight: for open source projects, 'gh api repos/OWNER/REPO/contents/FILE --jq .content | base64 -d' is the fastest way to fetch context docs. Two commands (README + config) unlocked 7 of 7 Needs Context SLTs for one course."

  # --- Human Review example: corrections that screenshots cannot capture ---
  - resource: "Human platform knowledge corrections"
    type: "Human Review"
    slts_unlocked:
      - "course:3.1"
      - "course:3.2"
    priority: "High"
    obtained: true
    effectiveness: confirmed
    notes: "Screenshots showed the UI but not the interaction model. Human corrections were essential for capturing nuances like multi-step workflows and implicit enrollment behavior."

# Statistics (reflects example data only)
stats:
  total_resources: 4
  obtained: 3
  partially_obtained: 1
  confirmed_effective: 4
